# Server port (optional, default is 8080)
# server.port=8080

# H2 Database Console Settings
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.trace=false
spring.h2.console.settings.web-allow-others=false

# Datasource Configuration (Spring Boot auto-configures H2 by default if on classpath)
spring.datasource.url=jdbc:h2:mem:jobportaldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JPA/Hibernate Settings (optional, Spring Boot provides sensible defaults)
spring.jpa.hibernate.ddl-auto=update # create-drop for dev, update or validate for prod
spring.jpa.show-sql=true # Show SQL queries in logs, useful for debugging
spring.jpa.properties.hibernate.format_sql=true # Format SQL in logs

# Springdoc OpenAPI (Swagger) UI path
# springdoc.swagger-ui.path=/swagger-ui.html # Default is /swagger-ui/index.html or /swagger-ui.html
